name: C99 correctness

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        cc:
          - gcc
          - clang

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Build R1-R7 checks, R6 proof, frozen R4 corpus, and R7 smoke
        run: make clean test r6-proof corpus-smoke r7-study-smoke CC="${{ matrix.cc }}"

      - name: Validate R7 local evidence script
        run: sh -n scripts/r7-run-local.sh

      - name: Reject truncated corpus output
        run: |
          if ./build/rune_corpus --profile smoke > /dev/full 2>/dev/null; then
            echo "corpus unexpectedly succeeded with unwritable stdout" >&2
            exit 1
          fi
